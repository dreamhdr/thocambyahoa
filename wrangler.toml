# Cloudflare Pages Configuration
# Không cần nhiều config - Cloudflare Pages tự động detect

name = "thocambyahoa"
compatibility_date = "2024-08-01"

# Pages-specific config (optional)
pages_build_output_dir = "dist"

# Note: Bindings (D1, R2) và Environment Variables
# được cấu hình trực tiếp trong Cloudflare Dashboard
# không cần khai báo ở đây cho Pages project

[[d1_databases]]
binding = "DB"
database_name = "byahoa_db"
database_id = "bb00e0a6-cdb3-4cb0-9dde-03285979e679"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "byahoa-images"
